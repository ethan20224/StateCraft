schema_version: "1.1"
name: usa-defense-industrial-base
expected_outcome: |
  A strategic and policy-level plan for rebuilding US defense industrial capacity
  (shipbuilding and munitions) from the White House's chair. It identifies the real
  binding constraints beyond money, lays out the congressional and budget path, uses
  allies, sets a realistic phased timeline, designs for durability across administrations,
  and stays at the strategic level with no weapons-engineering or targeting detail.
